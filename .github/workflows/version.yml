name: Version

# Reusable workflow that cuts a SemVer release with go-semantic-release.
#
# All three versioning concerns run in a single job with `contents: write`:
#
#   1. Detect rc-line — on non-default branches, reads the latest stable release
#      tag and derives the RC prerelease line dynamically (e.g. v2.0.0 → "2-rc").
#      Handles the breaking-change edge case where the major series changes and
#      callers can't know the correct rc-line ahead of time.
#
#   2. Release — runs go-semantic-release with the detected rc-line (RC on
#      non-default branches, stable on the default branch).
#
#   3. Create next RC baseline — after a stable release on the default branch,
#      automatically creates the next minor RC prerelease tag on rc-branch
#      (e.g. v2.0.0 → v2.1.0-rc.1) so the next push to rc-branch always has
#      a baseline to increment from. Idempotent — no-ops if the tag exists.

on:
  workflow_call:
    inputs:
      changelog-on-default:
        description: 'Generate + commit CHANGELOG.md on the default branch.'
        type: boolean
        required: false
        default: true
      changelog-on-rc:
        description: 'Generate + commit CHANGELOG.md on RC (non-default) branches.'
        type: boolean
        required: false
        default: false
      semrel-version:
        description: 'go-semantic-release binary version.'
        type: string
        required: false
        default: v2.31.0
      semrel-sha256:
        description: 'Expected SHA-256 of the semantic-release linux_amd64 binary for semrel-version. Empty skips verification (logs a warning).'
        type: string
        required: false
        default: ''
      rc-branch:
        description: 'Branch where RC releases are cut. Used to create the next RC baseline after a stable release on the default branch.'
        type: string
        required: false
        default: 'dev'
      force-stable:
        description: 'Cut a stable release even on non-default branches (skips the --prerelease flag). Use when a non-default branch should own version cutting and the default branch acts as a deploy-only rubber stamp.'
        type: boolean
        required: false
        default: false
      create-rc-baseline:
        description: 'After a stable release on the default branch, auto-create the next-minor RC prerelease tag on rc-branch. Set to false when the RC line is not maintained (e.g. when force-stable is used elsewhere).'
        type: boolean
        required: false
        default: true
    outputs:
      version:
        description: 'The version produced, or empty if no release was cut.'
        value: ${{ jobs.release.outputs.version }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout (full history and tags)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Install go-semantic-release
        env:
          SEMREL_VERSION: ${{ inputs.semrel-version }}
          SEMREL_SHA256: ${{ inputs.semrel-sha256 }}
        run: |
          url="https://github.com/go-semantic-release/semantic-release/releases/download/${SEMREL_VERSION}/semantic-release_${SEMREL_VERSION}_linux_amd64"
          curl -sSL "$url" -o ./semantic-release
          if [ -n "$SEMREL_SHA256" ]; then
            echo "${SEMREL_SHA256}  ./semantic-release" | sha256sum -c -
          else
            echo "::warning::semrel-sha256 not provided; skipping binary checksum verification"
          fi
          chmod +x ./semantic-release

      - name: Detect latest stable release
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CURRENT_REF: ${{ github.ref_name }}
        run: |
          if [ "$CURRENT_REF" = "$DEFAULT_BRANCH" ]; then
            echo "Branch is $CURRENT_REF (default) — stable release, no rc-line needed"
            echo "rc-line=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --exclude-pre-releases \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName')
          major=$(echo "${latest#v}" | cut -d. -f1)
          major=${major:-1}
          echo "Latest stable: ${latest:-none} → rc-line: ${major}-rc"
          echo "rc-line=${major}-rc" >> "$GITHUB_OUTPUT"

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CURRENT_REF: ${{ github.ref_name }}
          RC_LINE: ${{ steps.detect.outputs.rc-line }}
          WITH_CHANGELOG_DEFAULT: ${{ inputs.changelog-on-default }}
          WITH_CHANGELOG_RC: ${{ inputs.changelog-on-rc }}
          FORCE_STABLE: ${{ inputs.force-stable }}
        run: |
          set -- --token "$GH_TOKEN" --version-file --allow-no-changes
          if [ "$CURRENT_REF" != "$DEFAULT_BRANCH" ] && [ -n "$RC_LINE" ] && [ "$FORCE_STABLE" != "true" ]; then
            set -- "$@" --prerelease --maintained-version "$RC_LINE"
          fi
          if { [ "$CURRENT_REF" = "$DEFAULT_BRANCH" ] && [ "$WITH_CHANGELOG_DEFAULT" = "true" ]; } || \
             { [ "$CURRENT_REF" != "$DEFAULT_BRANCH" ] && [ "$WITH_CHANGELOG_RC" = "true" ]; }; then
            set -- "$@" --changelog CHANGELOG.md --prepend-changelog
          fi
          ./semantic-release "$@"

      - name: Expose version
        id: version
        run: |
          if [ -f .version ]; then echo "version=$(cat .version)" >> "$GITHUB_OUTPUT"; fi

      - name: Commit changelog
        if: |
          (inputs.changelog-on-default && github.ref_name == github.event.repository.default_branch) ||
          (inputs.changelog-on-rc && github.ref_name != github.event.repository.default_branch)
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -f .version ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git diff --staged --quiet || git commit -m "docs: update changelog for v$(cat .version) [skip ci]"
            git push origin "HEAD:$BRANCH"
          fi

      - name: Create next RC baseline
        if: |
          inputs.create-rc-baseline &&
          github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RC_BRANCH: ${{ inputs.rc-branch }}
        run: |
          [ -f .version ] || exit 0
          version="$(cat .version)"
          major=$(echo "$version" | cut -d. -f1)
          minor=$(echo "$version" | cut -d. -f2)
          next_minor=$((minor + 1))
          next_rc="v${major}.${next_minor}.0-rc.1"
          echo "Stable: v${version} → Next RC baseline: $next_rc on ${RC_BRANCH}"
          if gh release view "$next_rc" --repo "$GITHUB_REPOSITORY" &>/dev/null 2>&1; then
            echo "${next_rc} already exists, skipping."
            exit 0
          fi
          gh release create "$next_rc" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RC_BRANCH" \
            --title "$next_rc" \
            --notes "RC baseline — created automatically after v${version} was promoted to stable." \
            --prerelease
