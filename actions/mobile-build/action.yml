name: Mobile Build
description: >-
  Build an Expo / React Native app with EAS Build. Installs dependencies, sets
  up the EAS CLI authenticated with an Expo token, and runs `eas build` for the
  given profile and platform. Waits for the build to finish by default so a
  later submit step can pick it up.

inputs:
  expo-token:
    description: Expo access token (EXPO_TOKEN) with access to the project.
    required: true
  profile:
    description: EAS build profile (from eas.json), e.g. `production` or `preview`.
    required: true
  platform:
    description: Target platform — `android`, `ios`, or `all`.
    required: false
    default: all
  node-version:
    description: Node.js version used for the build.
    required: false
    default: "20"
  wait:
    description: Wait for the EAS build to complete. Set `false` to queue and return immediately.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Install
      shell: bash
      run: npm ci

    - uses: expo/expo-github-action@v8
      with:
        eas-version: latest
        token: ${{ inputs.expo-token }}

    - name: EAS build
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
        PLATFORM: ${{ inputs.platform }}
        WAIT: ${{ inputs.wait }}
      run: |
        wait_flag="--wait"
        if [ "$WAIT" != "true" ]; then wait_flag="--no-wait"; fi
        eas build \
          --profile "$PROFILE" \
          --platform "$PLATFORM" \
          --non-interactive \
          $wait_flag

    - name: Build summary
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
        PLATFORM: ${{ inputs.platform }}
      run: |
        {
          echo "### EAS build"
          echo ""
          echo "- Profile: \`$PROFILE\`"
          echo "- Platform: \`$PLATFORM\`"
          echo "- Commit: \`${{ github.sha }}\`"
        } >> "$GITHUB_STEP_SUMMARY"
