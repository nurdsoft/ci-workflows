name: Plan
description: >-
  Preview an infrastructure change. Installs the IaC tool, authenticates, runs
  the plan via the runner contract (or `run-*` overrides), posts the plan as a
  sticky PR comment, and on push uploads the saved plan for a later apply.

inputs:
  run-init:
    description: Explicit init command. Empty falls back to "<runner> tf-init".
    required: false
    default: ""
  run-plan:
    description: Explicit plan command. Empty falls back to "<runner> tf-plan".
    required: false
    default: ""
  runner:
    description: Task runner for the default contract targets.
    required: false
    default: make
  env:
    description: Target environment.
    required: true
  target:
    description: Target directory under deploy/ (e.g. app, setup).
    required: false
    default: app
  tool:
    description: "IaC tool to install: terraform | none."
    required: false
    default: terraform
  tf-version:
    description: Terraform version (when tool is terraform).
    required: false
    default: "1.x"
  gcp-wif-provider:
    description: GCP WIF provider. Empty skips GCP auth.
    required: false
    default: ""
  gcp-service-account:
    description: Service account impersonated via WIF.
    required: false
    default: ""
  aws-role-arn:
    description: AWS role to assume via OIDC. Empty skips AWS auth.
    required: false
    default: ""
  aws-region:
    description: AWS region for the assumed role.
    required: false
    default: ""
  github-token:
    description: Token to post the plan as a PR comment. Empty skips the comment.
    required: false
    default: ""
  plan-artifact-name:
    description: Name of the uploaded plan artifact (must match apply).
    required: false
    default: terraform-plan
  plan-extra-paths:
    description: Extra paths (one per line) to include in the plan artifact.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

    - name: Setup Terraform
      if: inputs.tool == 'terraform'
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
      with:
        terraform_version: ${{ inputs.tf-version }}
        terraform_wrapper: true

    - name: Authenticate
      if: inputs.gcp-wif-provider != '' || inputs.aws-role-arn != ''
      uses: nurdsoft/ci-workflows/actions/auth@v2
      with:
        gcp-wif-provider: ${{ inputs.gcp-wif-provider }}
        gcp-service-account: ${{ inputs.gcp-service-account }}
        aws-role-arn: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}

    - name: Init
      shell: bash
      env:
        RUN_INIT: ${{ inputs.run-init }}
        RUNNER: ${{ inputs.runner }}
        ENV: ${{ inputs.env }}
        TARGET: ${{ inputs.target }}
      run: |
        if [ -n "$RUN_INIT" ]; then bash -c "$RUN_INIT"; else $RUNNER tf-init ENV="$ENV" TARGET="$TARGET"; fi

    - name: Format check
      id: fmt
      if: inputs.tool == 'terraform'
      shell: bash
      env:
        RUNNER: ${{ inputs.runner }}
        ENV: ${{ inputs.env }}
        TARGET: ${{ inputs.target }}
      run: $RUNNER tf-fmt ENV="$ENV" TARGET="$TARGET"
      continue-on-error: true

    - name: Validate
      id: validate
      if: inputs.tool == 'terraform'
      shell: bash
      env:
        RUNNER: ${{ inputs.runner }}
        ENV: ${{ inputs.env }}
        TARGET: ${{ inputs.target }}
      run: $RUNNER tf-validate ENV="$ENV" TARGET="$TARGET"

    - name: Plan
      id: plan
      shell: bash
      env:
        RUN_PLAN: ${{ inputs.run-plan }}
        RUNNER: ${{ inputs.runner }}
        ENV: ${{ inputs.env }}
        TARGET: ${{ inputs.target }}
      run: |
        set -o pipefail
        if [ -n "$RUN_PLAN" ]; then
          bash -c "$RUN_PLAN" 2>&1 | tee /tmp/plan.txt
        else
          $RUNNER tf-plan ENV="$ENV" TARGET="$TARGET" 2>&1 | tee /tmp/plan.txt
        fi
      continue-on-error: true

    - name: Post plan as PR comment
      if: github.event_name == 'pull_request' && inputs.github-token != ''
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
      env:
        TF_TARGET: ${{ inputs.target }}
        FMT_OUTCOME: ${{ steps.fmt.outcome }}
        VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        PLAN_OUTCOME: ${{ steps.plan.outcome }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const target = process.env.TF_TARGET;
          const plan = fs.readFileSync('/tmp/plan.txt', 'utf8');
          const MAX = 60000;
          const planTrimmed = plan.length > MAX
            ? plan.slice(0, MAX) + `\n\n... (output truncated, ${plan.length - MAX} chars dropped)`
            : plan;
          const marker = `<!-- tf-plan-${target} -->`;
          const body = [
            marker,
            `## Terraform Plan — \`deploy/${target}\``,
            '',
            '| Step | Status |',
            '|------|--------|',
            `| Format | \`${process.env.FMT_OUTCOME}\` |`,
            `| Validate | \`${process.env.VALIDATE_OUTCOME}\` |`,
            `| Plan | \`${process.env.PLAN_OUTCOME}\` |`,
            '',
            '<details><summary>Show Plan Output</summary>',
            '',
            '```hcl',
            planTrimmed,
            '```',
            '',
            '</details>',
          ].join('\n');
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner, repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(
            c => c.user.type === 'Bot' && c.body.includes(marker)
          );
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: existing.id, body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
          }

    - name: Upload plan artifact
      if: github.event_name == 'push' && steps.plan.outcome == 'success'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: ${{ inputs.plan-artifact-name }}
        path: |
          deploy/${{ inputs.target }}/plan.tfplan
          ${{ inputs.plan-extra-paths }}
        if-no-files-found: warn
        retention-days: 1

    - name: Fail if plan failed
      if: steps.plan.outcome == 'failure'
      shell: bash
      run: exit 1
