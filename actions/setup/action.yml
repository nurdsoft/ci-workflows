name: Setup
description: >-
  Prepare the toolchain: install the language runtime, fetch dependencies, and
  (optionally) authenticate the EAS CLI for Expo projects. Checkout-free — the
  caller (or composing action) checks out first, so a job has a single checkout.

inputs:
  node-version:
    description: Node.js version.
    required: false
    default: "20"
  install:
    description: Dependency-install command.
    required: false
    default: "npm ci"
  expo-token:
    description: Expo access token. If set, logs in the EAS CLI for later EAS commands.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Install dependencies
      shell: bash
      env:
        INSTALL: ${{ inputs.install }}
      run: bash -c "$INSTALL"

    - name: Setup EAS CLI
      if: inputs.expo-token != ''
      uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e  # 8.2.1
      with:
        eas-version: latest
        token: ${{ inputs.expo-token }}
