name: GCP Secret Manager to env
description: >-
  Authenticate to Google Cloud via Workload Identity Federation and export
  key-value pairs from a Secret Manager JSON secret to the workflow
  environment ($GITHUB_ENV). Each value is masked. Exports survive subsequent
  steps and composite actions, including those that re-checkout the repo.

inputs:
  wif-provider:
    description: Google Cloud Workload Identity Federation provider resource name.
    required: true
  wif-service-account:
    description: Service account email impersonated via Workload Identity Federation.
    required: true
  project-id:
    description: Google Cloud project ID containing the secret.
    required: true
  secret-name:
    description: Secret Manager secret name (the `latest` version is fetched).
    required: true

runs:
  using: composite
  steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ inputs.wif-provider }}
        service_account: ${{ inputs.wif-service-account }}

    - name: Fetch secret from Secret Manager
      id: secret
      uses: google-github-actions/get-secretmanager-secrets@v2
      with:
        secrets: |
          ENV_VARS:projects/${{ inputs.project-id }}/secrets/${{ inputs.secret-name }}/versions/latest

    - name: Mask and export to GITHUB_ENV
      shell: bash
      env:
        SECRET_JSON: ${{ steps.secret.outputs.ENV_VARS }}
      run: |
        set -euo pipefail

        if ! jq -e 'type == "object"' <<<"$SECRET_JSON" >/dev/null; then
          echo "ERROR: secret payload is not a JSON object of {key: value} pairs" >&2
          exit 1
        fi

        # Mask each line of every value so multi-line secrets (PEM keys, certs)
        # are fully redacted in logs, not just their first line.
        while IFS= read -r line; do
          [ -n "$line" ] && echo "::add-mask::$line"
        done < <(jq -r '.[] | tostring' <<<"$SECRET_JSON")

        # Write to $GITHUB_ENV using a heredoc delimiter so values containing
        # newlines are preserved. Delimiter is randomized per run and verified
        # not to collide with any value before writing.
        delim="GHENV_EOF_$(openssl rand -hex 16)"
        if jq -e --arg d "$delim" 'any(.[]; tostring | contains($d))' <<<"$SECRET_JSON" >/dev/null; then
          echo "ERROR: secret value collided with generated heredoc delimiter; retry the job" >&2
          exit 1
        fi

        # Validate keys against the identifier shape GitHub Actions accepts.
        jq -r --arg d "$delim" '
          to_entries[] |
          if (.key | test("^[A-Za-z_][A-Za-z0-9_]*$")) then
            "\(.key)<<\($d)\n\(.value)\n\($d)"
          else
            "invalid env var key: \(.key)" | halt_error(1)
          end
        ' <<<"$SECRET_JSON" >> "$GITHUB_ENV"
