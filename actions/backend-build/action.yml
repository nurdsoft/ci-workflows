name: Backend Build
description: >-
  Build a container image and, optionally, push it to a registry. Authenticates
  to Google Cloud and/or AWS via keyless OIDC and configures docker for the
  registry before push. The build itself is wrapped around
  docker/build-push-action.

inputs:
  tags:
    description: Image tags to apply (one per line; each must be a full `registry/image:tag` URI).
    required: true
  push:
    description: Push the image after building. Set false for PR validation.
    required: false
    default: "false"
  registry:
    description: Container registry hostname for docker login (e.g. `us-central1-docker.pkg.dev`). Required when push is true.
    required: false
    default: ""
  dockerfile:
    description: Path to the Dockerfile.
    required: false
    default: Dockerfile
  context:
    description: Build context directory.
    required: false
    default: .
  wif-provider:
    description: Google Cloud Workload Identity Federation provider resource name. Leave empty to skip GCP authentication.
    required: false
    default: ""
  wif-service-account:
    description: Service account email impersonated via WIF. Required when wif-provider is set.
    required: false
    default: ""
  aws-role-arn:
    description: AWS IAM role ARN to assume via OIDC. Leave empty to skip AWS authentication.
    required: false
    default: ""
  aws-region:
    description: AWS region for the assumed role.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/checkout@v6

    - uses: docker/setup-buildx-action@v3

    - name: Authenticate to Google Cloud
      if: inputs.wif-provider != ''
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ inputs.wif-provider }}
        service_account: ${{ inputs.wif-service-account }}

    - name: Setup gcloud
      if: inputs.wif-provider != ''
      uses: google-github-actions/setup-gcloud@v3

    - name: Authenticate to AWS
      if: inputs.aws-role-arn != ''
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}

    - name: Docker login (Google Artifact Registry)
      if: inputs.push == 'true' && inputs.wif-provider != '' && inputs.registry != ''
      shell: bash
      run: gcloud auth configure-docker ${{ inputs.registry }} --quiet

    - name: Docker login (AWS ECR)
      if: inputs.push == 'true' && inputs.aws-role-arn != '' && inputs.registry != ''
      shell: bash
      env:
        REGION: ${{ inputs.aws-region }}
        REGISTRY: ${{ inputs.registry }}
      run: aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$REGISTRY"

    - name: Build and (optionally) push image
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: ${{ inputs.push }}
        tags: ${{ inputs.tags }}

    - name: Build summary
      shell: bash
      env:
        PUSHED: ${{ inputs.push }}
        TAGS: ${{ inputs.tags }}
      run: |
        echo "### Image built" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "- Pushed: \`$PUSHED\`" >> "$GITHUB_STEP_SUMMARY"
        echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "Tags:" >> "$GITHUB_STEP_SUMMARY"
        printf '%s\n' "$TAGS" | while IFS= read -r t; do
          [ -n "$t" ] && echo "- \`$t\`" >> "$GITHUB_STEP_SUMMARY"
        done
