name: Infrastructure Apply
description: >-
  Download a saved Terraform plan produced by the infra-plan action and apply
  it. Applying the saved plan guarantees what is applied is exactly what was
  planned in the same run. Authenticates to Google Cloud and/or AWS via
  keyless OIDC; the caller passes whichever auth applies and the unused auth
  step is skipped.

inputs:
  env:
    description: Target environment for the Terraform run.
    required: true
  target:
    description: Terraform target directory under `deploy/` (e.g. app, setup).
    required: false
    default: app
  tf-version:
    description: Terraform version to install.
    required: false
    default: "1.x"
  wif-provider:
    description: Google Cloud Workload Identity Federation provider resource name. Leave empty to skip GCP authentication.
    required: false
    default: ""
  wif-service-account:
    description: Service account email impersonated via Workload Identity Federation. Required when wif-provider is set.
    required: false
    default: ""
  aws-role-arn:
    description: IAM role ARN to assume via OIDC. Leave empty to skip AWS authentication.
    required: false
    default: ""
  aws-region:
    description: AWS region for the assumed role. Required only when aws-role-arn is set.
    required: false
    default: ""
  plan-artifact-name:
    description: Name of the plan artifact to download (must match the plan action).
    required: false
    default: terraform-plan

runs:
  using: composite
  steps:
    - uses: actions/checkout@v6

    - uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ inputs.tf-version }}
        terraform_wrapper: true

    - name: Authenticate to Google Cloud
      if: inputs.wif-provider != ''
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ inputs.wif-provider }}
        service_account: ${{ inputs.wif-service-account }}

    - name: Setup gcloud
      if: inputs.wif-provider != ''
      uses: google-github-actions/setup-gcloud@v3

    - name: Authenticate to AWS
      if: inputs.aws-role-arn != ''
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}

    - name: Download plan artifact
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.plan-artifact-name }}
        path: deploy/${{ inputs.target }}

    - name: Init
      shell: bash
      run: make tf-init ENV=${{ inputs.env }} TARGET=${{ inputs.target }}

    - name: Apply
      shell: bash
      run: make tf-apply ENV=${{ inputs.env }} TARGET=${{ inputs.target }}

    - name: Apply summary
      shell: bash
      run: |
        echo "### Infrastructure applied — \`deploy/${{ inputs.target }}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
