name: Deploy
description: >-
  Download a build-output artifact and publish it to a Cloud Storage bucket,
  then invalidate the CDN cache. Authenticates to Google Cloud with keyless
  Workload Identity Federation.

inputs:
  env:
    description: Target environment for the deploy.
    required: true
  wif-provider:
    description: Workload Identity Federation provider resource name.
    required: true
  wif-service-account:
    description: Service account email impersonated via Workload Identity Federation.
    required: true
  artifact-name:
    description: Name of the build-output artifact to download.
    required: false
    default: build-output
  app-url:
    description: Public URL of the deployed app, shown in the run summary. Optional.
    required: false
    default: ""
  app-version:
    description: Version string shown in the run summary. Optional.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/checkout@v6

    - name: Download build artifact
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact-name }}
        path: out

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ inputs.wif-provider }}
        service_account: ${{ inputs.wif-service-account }}

    - uses: google-github-actions/setup-gcloud@v3

    - name: Publish to bucket
      shell: bash
      run: make rsync ENV=${{ inputs.env }}

    - name: Invalidate CDN
      shell: bash
      run: make cdn-invalidate ENV=${{ inputs.env }}

    - name: Deploy summary
      shell: bash
      env:
        APP_URL: ${{ inputs.app-url }}
        APP_VERSION: ${{ inputs.app-version }}
      run: |
        if [ -n "$APP_URL" ]; then
          echo "### Deployed to $APP_URL" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
        fi
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "- Version: \`${APP_VERSION:-n/a}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
