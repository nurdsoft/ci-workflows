name: Deploy
description: >-
  Ship the build. Runs `run` if given, otherwise `<runner> deploy` (default make)
  -- no Makefile required when `run` is supplied. Optionally downloads a build
  artifact, prepares a Node/Expo toolchain, and authenticates to a cloud.

  Cloud Run service path: when `cloudrun-service` is set the action switches to a
  Cloud Run service deploy flow -- authenticates via WIF, optionally fetches runtime
  env vars from Secret Manager and injects them as Cloud Run environment variables.
  The standard deploy steps are skipped entirely in this mode.

  Cloud Run job path: when `cloudrun-job` is set the action deploys a Cloud Run job
  and optionally creates a Cloud Scheduler trigger (idempotent). Shares the same WIF
  auth and Secret Manager fetch as the service path.

inputs:
  # -- Static deploy inputs ---------------------------------------------------
  run:
    description: Explicit deploy command. Empty falls back to "<runner> deploy".
    required: false
    default: ""
  runner:
    description: Task runner for the default contract target.
    required: false
    default: make
  env:
    description: Target environment, passed to the deploy as ENV.
    required: false
    default: ""
  node-version:
    description: If set, install the Node/Expo toolchain before deploying.
    required: false
    default: ""
  expo-token:
    description: Expo token, forwarded to setup for EAS submit/update.
    required: false
    default: ""
  download-artifact:
    description: Download a build artifact before deploying.
    required: false
    default: "false"
  artifact-name:
    description: Artifact to download.
    required: false
    default: build-output
  build-output-path:
    description: Local path the artifact is unpacked to.
    required: false
    default: out

  # -- Shared cloud auth inputs -----------------------------------------------
  gcp-wif-provider:
    description: GCP WIF provider. Empty skips GCP auth.
    required: false
    default: ""
  gcp-service-account:
    description: Service account impersonated via WIF.
    required: false
    default: ""
  aws-role-arn:
    description: AWS role to assume via OIDC. Empty skips AWS auth.
    required: false
    default: ""
  aws-region:
    description: AWS region for the assumed role.
    required: false
    default: ""

  # -- Shared Cloud Run inputs (service and job paths) ------------------------
  image-name:
    description: Docker image name within the Artifact Registry repository.
    required: false
    default: ""
  image-tag:
    description: Image tag to deploy. Defaults to the commit SHA when empty.
    required: false
    default: ""
  gcp-project-id:
    description: GCP project ID. Required when cloudrun-service or cloudrun-job is set.
    required: false
    default: ""
  gcp-region:
    description: GCP region (e.g. us-central1). Required when cloudrun-service or cloudrun-job is set.
    required: false
    default: ""
  gcp-repository:
    description: Artifact Registry repository name. Required when cloudrun-service or cloudrun-job is set.
    required: false
    default: ""
  gcp-secret-name:
    description: >-
      Secret Manager secret holding runtime env vars as a JSON object.
      Injected as Cloud Run environment variables. Empty skips the fetch.
    required: false
    default: ""
  cloudrun-flags:
    description: >-
      Extra flags forwarded verbatim to the Cloud Run deploy command
      (e.g. "--allow-unauthenticated --ingress=internal-and-cloud-load-balancing").
    required: false
    default: ""

  # -- Cloud Run service path (set cloudrun-service to activate) --------------
  cloudrun-service:
    description: >-
      Cloud Run service name. When set, activates the Cloud Run service deploy path
      and skips the standard deploy steps.
    required: false
    default: ""

  # -- Cloud Run job path (set cloudrun-job to activate) ----------------------
  cloudrun-job:
    description: >-
      Cloud Run job name. When set, activates the Cloud Run job deploy path
      and skips the standard deploy steps.
    required: false
    default: ""
  scheduler-name:
    description: Cloud Scheduler trigger name (idempotent — skipped if already exists). Empty skips scheduler creation.
    required: false
    default: ""
  scheduler-cron:
    description: Cron schedule expression (e.g. "0 * * * *"). Required when scheduler-name is set.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

    # -- Static path -----------------------------------------------------------
    - name: Download artifact
      if: inputs.download-artifact == 'true' && inputs.cloudrun-service == '' && inputs.cloudrun-job == ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.build-output-path }}

    - name: Setup toolchain
      if: inputs.node-version != '' && inputs.cloudrun-service == '' && inputs.cloudrun-job == ''
      uses: nurdsoft/ci-workflows/actions/setup@v2
      with:
        node-version: ${{ inputs.node-version }}
        expo-token: ${{ inputs.expo-token }}

    # -- Shared: cloud auth (all Cloud Run paths) ------------------------------
    - name: Authenticate
      if: inputs.gcp-wif-provider != '' || inputs.aws-role-arn != ''
      uses: nurdsoft/ci-workflows/actions/auth@v2
      with:
        gcp-wif-provider: ${{ inputs.gcp-wif-provider }}
        gcp-service-account: ${{ inputs.gcp-service-account }}
        aws-role-arn: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}

    # -- Static path -----------------------------------------------------------
    - name: Deploy
      if: inputs.cloudrun-service == '' && inputs.cloudrun-job == ''
      shell: bash
      env:
        USER_RUN: ${{ inputs.run }}
        RUNNER: ${{ inputs.runner }}
        ENV: ${{ inputs.env }}
      run: |
        if [ -n "$USER_RUN" ]; then
          bash -c "$USER_RUN"
        else
          $RUNNER deploy ENV="$ENV"
        fi

    # -- Shared: Secret Manager fetch (service and job paths) ------------------
    - name: Fetch runtime env vars from Secret Manager
      id: secret
      if: (inputs.cloudrun-service != '' || inputs.cloudrun-job != '') && inputs.gcp-secret-name != ''
      uses: google-github-actions/get-secretmanager-secrets@2b5f97c5a4b9c105e64646762ad4fc3f5128e6f5  # v2.2.5
      with:
        secrets: |
          ENV_VARS:projects/${{ inputs.gcp-project-id }}/secrets/${{ inputs.gcp-secret-name }}/versions/latest

    - name: Format env vars for Cloud Run
      id: env_vars
      if: (inputs.cloudrun-service != '' || inputs.cloudrun-job != '') && inputs.gcp-secret-name != ''
      shell: bash
      env:
        SECRET_JSON: ${{ steps.secret.outputs.ENV_VARS }}
        PROJECT_ID: ${{ inputs.gcp-project-id }}
      run: |
        set -euo pipefail

        if ! jq -e 'type == "object"' <<<"$SECRET_JSON" >/dev/null; then
          echo "ERROR: secret payload is not a JSON object of {key: value} pairs" >&2
          exit 1
        fi

        while IFS= read -r line; do
          [ -n "$line" ] && echo "::add-mask::$line"
        done < <(jq -r '.[] | tostring' <<<"$SECRET_JSON")

        formatted=$(jq -r 'to_entries[] | "\(.key)=\(.value)"' <<<"$SECRET_JSON" | paste -sd, -)
        echo "value=GOOGLE_CLOUD_PROJECT=${PROJECT_ID},${formatted}" >> "$GITHUB_OUTPUT"

    # -- Cloud Run service path ------------------------------------------------
    - name: Deploy to Cloud Run service
      if: inputs.cloudrun-service != ''
      uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522  # v2.7.6
      with:
        service: ${{ inputs.cloudrun-service }}
        image: ${{ inputs.gcp-region }}-docker.pkg.dev/${{ inputs.gcp-project-id }}/${{ inputs.gcp-repository }}/${{ inputs.image-name }}:${{ inputs.image-tag || github.sha }}
        region: ${{ inputs.gcp-region }}
        flags: ${{ inputs.cloudrun-flags }}
        env_vars: ${{ steps.env_vars.outputs.value }}
        env_vars_update_strategy: overwrite

    # -- Cloud Run job path ----------------------------------------------------
    - name: Deploy to Cloud Run job
      if: inputs.cloudrun-job != ''
      uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522  # v2.7.6
      with:
        job: ${{ inputs.cloudrun-job }}
        image: ${{ inputs.gcp-region }}-docker.pkg.dev/${{ inputs.gcp-project-id }}/${{ inputs.gcp-repository }}/${{ inputs.image-name }}:${{ inputs.image-tag || github.sha }}
        region: ${{ inputs.gcp-region }}
        flags: ${{ inputs.cloudrun-flags }}
        env_vars: ${{ steps.env_vars.outputs.value }}
        env_vars_update_strategy: overwrite

    - name: Create Cloud Scheduler
      if: inputs.cloudrun-job != '' && inputs.scheduler-name != ''
      shell: bash
      env:
        SCHEDULER_NAME: ${{ inputs.scheduler-name }}
        REGION: ${{ inputs.gcp-region }}
        PROJECT_ID: ${{ inputs.gcp-project-id }}
        SCHEDULE: ${{ inputs.scheduler-cron }}
        SERVICE_ACCOUNT: ${{ inputs.gcp-service-account }}
        JOB_NAME: ${{ inputs.cloudrun-job }}
      run: |
        set -euo pipefail

        if gcloud scheduler jobs describe "$SCHEDULER_NAME" \
           --location="$REGION" \
           --project="$PROJECT_ID" >/dev/null 2>&1; then
          echo "Scheduler '$SCHEDULER_NAME' already exists, skipping creation"
        else
          echo "Creating scheduler '$SCHEDULER_NAME'..."
          gcloud scheduler jobs create http "$SCHEDULER_NAME" \
            --location="$REGION" \
            --schedule="$SCHEDULE" \
            --time-zone="Etc/UTC" \
            --uri="https://${REGION}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/${PROJECT_ID}/jobs/${JOB_NAME}:run" \
            --http-method=POST \
            --oidc-service-account-email="$SERVICE_ACCOUNT" \
            --oidc-token-audience="https://${REGION}-run.googleapis.com/"
        fi

    # -- Summary (all paths) ---------------------------------------------------
    - name: Summary
      shell: bash
      env:
        CLOUDRUN_SERVICE: ${{ inputs.cloudrun-service }}
        CLOUDRUN_JOB: ${{ inputs.cloudrun-job }}
        SCHEDULER_NAME: ${{ inputs.scheduler-name }}
        REGION: ${{ inputs.gcp-region }}
        IMAGE: ${{ inputs.gcp-region }}-docker.pkg.dev/${{ inputs.gcp-project-id }}/${{ inputs.gcp-repository }}/${{ inputs.image-name }}
        TAG: ${{ inputs.image-tag || github.sha }}
        ENV: ${{ inputs.env }}
        SHA: ${{ github.sha }}
      run: |
        {
          echo "### Deploy"
          echo ""
          if [ -n "$CLOUDRUN_SERVICE" ]; then
            echo "- Service: \`${CLOUDRUN_SERVICE}\` (${REGION})"
            echo "- Image: \`${IMAGE}:${TAG}\`"
          elif [ -n "$CLOUDRUN_JOB" ]; then
            echo "- Job: \`${CLOUDRUN_JOB}\` (${REGION})"
            echo "- Image: \`${IMAGE}:${TAG}\`"
            [ -n "$SCHEDULER_NAME" ] && echo "- Scheduler: \`${SCHEDULER_NAME}\`"
          else
            echo "- Env: \`${ENV:-n/a}\`"
          fi
          echo "- Commit: \`$SHA\`"
        } >> "$GITHUB_STEP_SUMMARY"
