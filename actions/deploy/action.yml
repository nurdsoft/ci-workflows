name: Deploy
description: >-
  Ship the build. Runs `run` if given, otherwise `<runner> deploy` (default make)
  -- no Makefile required when `run` is supplied. Optionally restores the build
  output from the Actions cache (restore-cache), prepares a Node/Expo toolchain,
  and authenticates to a cloud.

  Cache restore: restore-cache pairs with the build action's output: cache. It
  restores build-output-path using an exact cache-key match and fails the deploy
  on a cache miss, so an evicted or missing cache never results in a silent empty
  deploy. cache-key must match the build side.

  Cloud Run service path: when `cloudrun-service` is set the action switches to a
  Cloud Run service deploy flow -- authenticates via WIF, optionally fetches runtime
  env vars from Secret Manager and injects them as Cloud Run environment variables.
  The standard deploy steps are skipped entirely in this mode.

  Cloud Run job path: when `cloudrun-job` is set the action deploys a Cloud Run job
  and optionally reconciles a Cloud Scheduler trigger (created if missing, updated if
  existing). Shares the same WIF auth and Secret Manager fetch as the service path.

inputs:
  # -- Static deploy inputs ---------------------------------------------------
  run:
    description: Explicit deploy command. Empty falls back to "<runner> deploy".
    required: false
    default: ""
  runner:
    description: Task runner for the default contract target.
    required: false
    default: make
  env:
    description: Target environment, passed to the deploy as ENV.
    required: false
    default: ""
  node-version:
    description: If set, install the Node/Expo toolchain before deploying.
    required: false
    default: ""
  expo-token:
    description: Expo token, forwarded to setup for EAS submit/update.
    required: false
    default: ""
  build-output-path:
    description: Local path the cache is restored to.
    required: false
    default: out
  restore-cache:
    description: >-
      Restore the build output from the Actions cache before deploying.
      Fails the deploy on a cache miss.
    required: false
    default: "false"
  cache-key:
    description: >-
      Cache key to restore the build output from when restore-cache is true.
      Restored with an exact-key match and must equal the build side's cache-key;
      a miss fails the deploy. Required when restore-cache is true.
    required: false
    default: ""

  # -- Shared cloud auth inputs -----------------------------------------------
  gcp-wif-provider:
    description: GCP WIF provider. Empty skips GCP auth.
    required: false
    default: ""
  gcp-service-account:
    description: Service account impersonated via WIF.
    required: false
    default: ""
  aws-role-arn:
    description: AWS role to assume via OIDC. Empty skips AWS auth.
    required: false
    default: ""
  aws-region:
    description: AWS region for the assumed role.
    required: false
    default: ""

  # -- Shared Cloud Run inputs (service and job paths) ------------------------
  image-name:
    description: Docker image name within the Artifact Registry repository.
    required: false
    default: ""
  image-tag:
    description: Image tag to deploy. Defaults to the commit SHA when empty.
    required: false
    default: ""
  gcp-project-id:
    description: GCP project ID. Required when cloudrun-service or cloudrun-job is set.
    required: false
    default: ""
  gcp-region:
    description: GCP region (e.g. us-central1). Required when cloudrun-service or cloudrun-job is set.
    required: false
    default: ""
  gcp-repository:
    description: Artifact Registry repository name. Required when cloudrun-service or cloudrun-job is set.
    required: false
    default: ""
  gcp-secret-name:
    description: >-
      Secret Manager secret holding runtime env vars as a JSON object.
      Injected as Cloud Run environment variables. Empty skips the fetch.
    required: false
    default: ""
  cloudrun-flags:
    description: >-
      Extra flags forwarded verbatim to the Cloud Run deploy command
      (e.g. "--allow-unauthenticated --ingress=internal-and-cloud-load-balancing").
    required: false
    default: ""

  # -- Cloud Run service path (set cloudrun-service to activate) --------------
  cloudrun-service:
    description: >-
      Cloud Run service name. When set, activates the Cloud Run service deploy path
      and skips the standard deploy steps.
    required: false
    default: ""

  # -- Cloud Run job path (set cloudrun-job to activate) ----------------------
  cloudrun-job:
    description: >-
      Cloud Run job name. When set, activates the Cloud Run job deploy path
      and skips the standard deploy steps.
    required: false
    default: ""
  scheduler-name:
    description: Cloud Scheduler trigger name. Reconciled on every deploy (created if missing, updated if existing). Empty skips scheduler management.
    required: false
    default: ""
  schedule-time:
    description: Cron schedule expression (e.g. "0 * * * *"). Required when scheduler-name is set.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

    # -- Static path -----------------------------------------------------------
    - name: Restore build cache
      id: restore-cache
      if: inputs.restore-cache == 'true' && inputs.cloudrun-service == '' && inputs.cloudrun-job == ''
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
      with:
        path: ${{ inputs.build-output-path }}
        key: ${{ inputs.cache-key }}

    - name: Fail on build cache miss
      if: inputs.restore-cache == 'true' && inputs.cloudrun-service == '' && inputs.cloudrun-job == '' && steps.restore-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        CACHE_KEY: ${{ inputs.cache-key }}
      run: |
        echo "ERROR: build cache '$CACHE_KEY' not found — refusing to deploy a missing build." >&2
        exit 1

    - name: Setup toolchain
      if: inputs.node-version != '' && inputs.cloudrun-service == '' && inputs.cloudrun-job == ''
      uses: nurdsoft/ci-workflows/actions/setup@v2
      with:
        node-version: ${{ inputs.node-version }}
        expo-token: ${{ inputs.expo-token }}

    # -- Shared: cloud auth (all Cloud Run paths) ------------------------------
    - name: Authenticate
      if: inputs.gcp-wif-provider != '' || inputs.aws-role-arn != ''
      uses: nurdsoft/ci-workflows/actions/auth@v2
      with:
        gcp-wif-provider: ${{ inputs.gcp-wif-provider }}
        gcp-service-account: ${{ inputs.gcp-service-account }}
        aws-role-arn: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}

    # -- Shared: input validation (Cloud Run paths) ----------------------------
    - name: Validate Cloud Run inputs
      if: inputs.cloudrun-service != '' || inputs.cloudrun-job != ''
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        REGION: ${{ inputs.gcp-region }}
        PROJECT_ID: ${{ inputs.gcp-project-id }}
        REPOSITORY: ${{ inputs.gcp-repository }}
        SCHEDULER_NAME: ${{ inputs.scheduler-name }}
        SCHEDULE: ${{ inputs.schedule-time }}
      run: |
        set -euo pipefail
        missing=()
        [ -z "$IMAGE_NAME" ]   && missing+=("image-name")
        [ -z "$REGION" ]       && missing+=("gcp-region")
        [ -z "$PROJECT_ID" ]   && missing+=("gcp-project-id")
        [ -z "$REPOSITORY" ]   && missing+=("gcp-repository")
        if [ "${#missing[@]}" -gt 0 ]; then
          echo "ERROR: Cloud Run deploy requires the following inputs: ${missing[*]}" >&2
          exit 1
        fi
        if [ -n "$SCHEDULER_NAME" ] && [ -z "$SCHEDULE" ]; then
          echo "ERROR: schedule-time is required when scheduler-name is set" >&2
          exit 1
        fi

    # -- Static path -----------------------------------------------------------
    - name: Deploy
      if: inputs.cloudrun-service == '' && inputs.cloudrun-job == ''
      shell: bash
      env:
        USER_RUN: ${{ inputs.run }}
        RUNNER: ${{ inputs.runner }}
        ENV: ${{ inputs.env }}
      run: |
        if [ -n "$USER_RUN" ]; then
          bash -c "$USER_RUN"
        else
          $RUNNER deploy ENV="$ENV"
        fi

    # -- Shared: Secret Manager fetch (service and job paths) ------------------
    - name: Fetch runtime env vars from Secret Manager
      id: secret
      if: (inputs.cloudrun-service != '' || inputs.cloudrun-job != '') && inputs.gcp-secret-name != ''
      uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262  # v3.0.0
      with:
        secrets: |
          ENV_VARS:projects/${{ inputs.gcp-project-id }}/secrets/${{ inputs.gcp-secret-name }}/versions/latest

    - name: Format env vars for Cloud Run
      id: env_vars
      if: inputs.cloudrun-service != '' || inputs.cloudrun-job != ''
      shell: bash
      env:
        SECRET_JSON: ${{ steps.secret.outputs.ENV_VARS }}
        PROJECT_ID: ${{ inputs.gcp-project-id }}
      run: |
        set -euo pipefail

        # Validate + mask secret payload only when one was fetched.
        if [ -n "$SECRET_JSON" ]; then
          if ! jq -e 'type == "object"' <<<"$SECRET_JSON" >/dev/null; then
            echo "ERROR: secret payload is not a JSON object of {key: value} pairs" >&2
            exit 1
          fi
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done < <(jq -r '.[] | tostring' <<<"$SECRET_JSON")
        fi

        # Emit env vars as newline-delimited KEY=VALUE so values containing
        # commas survive. GOOGLE_CLOUD_PROJECT is always set in Cloud Run mode.
        {
          echo "value<<__GHA_EOF__"
          echo "GOOGLE_CLOUD_PROJECT=${PROJECT_ID}"
          if [ -n "$SECRET_JSON" ]; then
            jq -r 'to_entries[] | "\(.key)=\(.value)"' <<<"$SECRET_JSON"
          fi
          echo "__GHA_EOF__"
        } >> "$GITHUB_OUTPUT"

    # -- Cloud Run service path ------------------------------------------------
    - name: Deploy to Cloud Run service
      if: inputs.cloudrun-service != ''
      uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d  # v3.0.1
      with:
        service: ${{ inputs.cloudrun-service }}
        image: ${{ inputs.gcp-region }}-docker.pkg.dev/${{ inputs.gcp-project-id }}/${{ inputs.gcp-repository }}/${{ inputs.image-name }}:${{ inputs.image-tag || github.sha }}
        region: ${{ inputs.gcp-region }}
        flags: ${{ inputs.cloudrun-flags }}
        env_vars: ${{ steps.env_vars.outputs.value }}
        env_vars_update_strategy: overwrite

    # -- Cloud Run job path ----------------------------------------------------
    - name: Deploy to Cloud Run job
      if: inputs.cloudrun-job != ''
      uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d  # v3.0.1
      with:
        job: ${{ inputs.cloudrun-job }}
        image: ${{ inputs.gcp-region }}-docker.pkg.dev/${{ inputs.gcp-project-id }}/${{ inputs.gcp-repository }}/${{ inputs.image-name }}:${{ inputs.image-tag || github.sha }}
        region: ${{ inputs.gcp-region }}
        flags: ${{ inputs.cloudrun-flags }}
        env_vars: ${{ steps.env_vars.outputs.value }}
        env_vars_update_strategy: overwrite

    - name: Reconcile Cloud Scheduler
      # Auth: --oauth-service-account-email (NOT --oidc-...). The Cloud Run
      # admin API V1 endpoint (`apis/run.googleapis.com/v1/.../jobs/<job>:run`)
      # requires an OAuth2 access token; GCP began rejecting OIDC ID tokens
      # against this endpoint on 2026-05-29, causing every previously-working
      # scheduler to start failing with 401 UNAUTHENTICATED.
      if: inputs.cloudrun-job != '' && inputs.scheduler-name != ''
      shell: bash
      env:
        SCHEDULER_NAME: ${{ inputs.scheduler-name }}
        REGION: ${{ inputs.gcp-region }}
        PROJECT_ID: ${{ inputs.gcp-project-id }}
        SCHEDULE: ${{ inputs.schedule-time }}
        SERVICE_ACCOUNT: ${{ inputs.gcp-service-account }}
        JOB_NAME: ${{ inputs.cloudrun-job }}
      run: |
        set -euo pipefail

        URI="https://${REGION}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/${PROJECT_ID}/jobs/${JOB_NAME}:run"

        if gcloud scheduler jobs describe "$SCHEDULER_NAME" \
           --location="$REGION" \
           --project="$PROJECT_ID" >/dev/null 2>&1; then
          echo "Scheduler '$SCHEDULER_NAME' exists, reconciling configuration..."
          gcloud scheduler jobs update http "$SCHEDULER_NAME" \
            --location="$REGION" \
            --project="$PROJECT_ID" \
            --schedule="$SCHEDULE" \
            --time-zone="Etc/UTC" \
            --uri="$URI" \
            --http-method=POST \
            --oauth-service-account-email="$SERVICE_ACCOUNT"
        else
          echo "Scheduler '$SCHEDULER_NAME' does not exist, creating..."
          gcloud scheduler jobs create http "$SCHEDULER_NAME" \
            --location="$REGION" \
            --project="$PROJECT_ID" \
            --schedule="$SCHEDULE" \
            --time-zone="Etc/UTC" \
            --uri="$URI" \
            --http-method=POST \
            --oauth-service-account-email="$SERVICE_ACCOUNT"
        fi

    # -- Summary (all paths) ---------------------------------------------------
    - name: Summary
      shell: bash
      env:
        CLOUDRUN_SERVICE: ${{ inputs.cloudrun-service }}
        CLOUDRUN_JOB: ${{ inputs.cloudrun-job }}
        SCHEDULER_NAME: ${{ inputs.scheduler-name }}
        REGION: ${{ inputs.gcp-region }}
        IMAGE: ${{ inputs.gcp-region }}-docker.pkg.dev/${{ inputs.gcp-project-id }}/${{ inputs.gcp-repository }}/${{ inputs.image-name }}
        TAG: ${{ inputs.image-tag || github.sha }}
        ENV: ${{ inputs.env }}
        SHA: ${{ github.sha }}
      run: |
        {
          echo "### Deploy"
          echo ""
          if [ -n "$CLOUDRUN_SERVICE" ]; then
            echo "- Service: \`${CLOUDRUN_SERVICE}\` (${REGION})"
            echo "- Image: \`${IMAGE}:${TAG}\`"
          elif [ -n "$CLOUDRUN_JOB" ]; then
            echo "- Job: \`${CLOUDRUN_JOB}\` (${REGION})"
            echo "- Image: \`${IMAGE}:${TAG}\`"
            [ -n "$SCHEDULER_NAME" ] && echo "- Scheduler: \`${SCHEDULER_NAME}\`"
          else
            echo "- Env: \`${ENV:-n/a}\`"
          fi
          echo "- Commit: \`$SHA\`"
        } >> "$GITHUB_STEP_SUMMARY"
