name: Auth
description: >-
  Obtain cloud credentials via keyless OIDC. Pass only the provider you use; the
  others are skipped. Credentials persist in the job environment for later steps
  and any CLI they invoke.

inputs:
  gcp-wif-provider:
    description: GCP Workload Identity Federation provider resource name. Empty skips GCP.
    required: false
    default: ""
  gcp-service-account:
    description: Service account impersonated via WIF. Required when gcp-wif-provider is set.
    required: false
    default: ""
  setup-gcloud:
    description: Install the gcloud CLI after authenticating.
    required: false
    default: "true"
  aws-role-arn:
    description: AWS IAM role to assume via OIDC. Empty skips AWS.
    required: false
    default: ""
  aws-region:
    description: AWS region for the assumed role. Required when aws-role-arn is set.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Authenticate to Google Cloud
      if: inputs.gcp-wif-provider != ''
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
      with:
        workload_identity_provider: ${{ inputs.gcp-wif-provider }}
        service_account: ${{ inputs.gcp-service-account }}

    - name: Setup gcloud
      if: inputs.gcp-wif-provider != '' && inputs.setup-gcloud == 'true'
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1

    - name: Authenticate to AWS
      if: inputs.aws-role-arn != ''
      uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885  # v6.1.1
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}
