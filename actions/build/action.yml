name: Build
description: >-
  Install dependencies, lint, type-check and build the project, then upload
  the build output as an artifact. Lint and type-check are informational and do
  not fail the build.

inputs:
  env:
    description: Target environment for the build.
    required: true
  node-version:
    description: Node.js version used for the build.
    required: false
    default: "20"
  app-version:
    description: Version string injected into the build as the value of `version-env-var`.
    required: false
    default: ""
  version-env-var:
    description: Name of the environment variable that receives `app-version` during the build.
    required: false
    default: NEXT_PUBLIC_APP_VERSION
  build-output-path:
    description: Path of the build output directory uploaded as the artifact.
    required: false
    default: out
  artifact-name:
    description: Name of the uploaded build-output artifact.
    required: false
    default: build-output
  artifact-retention-days:
    description: Retention period, in days, for the build-output artifact.
    required: false
    default: "7"

runs:
  using: composite
  steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Install
      shell: bash
      run: make install

    - name: Lint
      shell: bash
      run: make lint
      continue-on-error: true

    - name: Type-check
      shell: bash
      run: make typecheck
      continue-on-error: true

    - name: Build
      shell: bash
      env:
        APP_VERSION_VAR: ${{ inputs.version-env-var }}
        APP_VERSION_VAL: ${{ inputs.app-version }}
        ENV: ${{ inputs.env }}
      run: |
        if [ -n "$APP_VERSION_VAR" ]; then
          export "$APP_VERSION_VAR=$APP_VERSION_VAL"
        fi
        make build ENV="$ENV"

    - name: Upload build artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.build-output-path }}
        retention-days: ${{ inputs.artifact-retention-days }}
