name: Docker Build & Publish
description: >-
  Build a Docker image and push it directly to Google Artifact Registry.
  Authenticates via WIF, optionally fetches build-time env vars from Secret
  Manager and writes them to .env.production so NEXT_PUBLIC_* (or equivalent)
  vars are baked into the client bundle before the image is assembled.
  Pushes both a commit-SHA tag and `latest` in a single buildx step.

inputs:
  gcp-wif-provider:
    description: GCP Workload Identity Federation provider resource name.
    required: true
  gcp-service-account:
    description: Service account impersonated via WIF.
    required: true
  gcp-project-id:
    description: GCP project ID — used to build the Artifact Registry hostname and Secret Manager path.
    required: true
  gcp-region:
    description: GCP region (e.g. us-central1) — used to build the Artifact Registry hostname.
    required: true
  gcp-repository:
    description: Artifact Registry repository name.
    required: true
  image-name:
    description: Image name within the repository.
    required: true
  image-tag:
    description: Primary image tag. Defaults to the triggering commit SHA when empty.
    required: false
    default: ""
  gcp-secret-name:
    description: >-
      Secret Manager secret whose latest version holds build-time env vars as a
      JSON object of {"KEY": "VALUE"} pairs. Written to .env.production before
      the Docker build. Empty skips the fetch.
    required: false
    default: ""
  context:
    description: Docker build context path.
    required: false
    default: "."
  dockerfile:
    description: Path to the Dockerfile, relative to the repository root.
    required: false
    default: "Dockerfile"

runs:
  using: composite
  steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

    - uses: nurdsoft/ci-workflows/actions/auth@v2
      with:
        gcp-wif-provider: ${{ inputs.gcp-wif-provider }}
        gcp-service-account: ${{ inputs.gcp-service-account }}

    - name: Configure Docker for Artifact Registry
      shell: bash
      env:
        REGION: ${{ inputs.gcp-region }}
      run: gcloud auth configure-docker "${REGION}-docker.pkg.dev"

    - name: Fetch build env vars from Secret Manager
      id: secret
      if: inputs.gcp-secret-name != ''
      uses: google-github-actions/get-secretmanager-secrets@v2
      with:
        secrets: |
          ENV_VARS:projects/${{ inputs.gcp-project-id }}/secrets/${{ inputs.gcp-secret-name }}/versions/latest

    - name: Mask and write .env.production
      if: inputs.gcp-secret-name != ''
      shell: bash
      env:
        SECRET_JSON: ${{ steps.secret.outputs.ENV_VARS }}
      run: |
        set -euo pipefail

        if ! jq -e 'type == "object"' <<<"$SECRET_JSON" >/dev/null; then
          echo "ERROR: secret payload is not a JSON object of {key: value} pairs" >&2
          exit 1
        fi

        while IFS= read -r line; do
          [ -n "$line" ] && echo "::add-mask::$line"
        done < <(jq -r '.[] | tostring' <<<"$SECRET_JSON")

        jq -r 'to_entries[] | "\(.key)=\(.value)"' <<<"$SECRET_JSON" > .env.production

    - uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: true
        tags: |
          ${{ inputs.gcp-region }}-docker.pkg.dev/${{ inputs.gcp-project-id }}/${{ inputs.gcp-repository }}/${{ inputs.image-name }}:${{ inputs.image-tag || github.sha }}
          ${{ inputs.gcp-region }}-docker.pkg.dev/${{ inputs.gcp-project-id }}/${{ inputs.gcp-repository }}/${{ inputs.image-name }}:latest

    - name: Summary
      shell: bash
      env:
        IMAGE: ${{ inputs.gcp-region }}-docker.pkg.dev/${{ inputs.gcp-project-id }}/${{ inputs.gcp-repository }}/${{ inputs.image-name }}
        TAG: ${{ inputs.image-tag || github.sha }}
        SHA: ${{ github.sha }}
      run: |
        {
          echo "### Docker Build & Publish"
          echo ""
          echo "- Image: \`${IMAGE}:${TAG}\`"
          echo "- Commit: \`${SHA}\`"
        } >> "$GITHUB_STEP_SUMMARY"
