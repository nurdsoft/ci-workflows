name: Notify
description: >-
  Post a pipeline result to a chat channel as a rich card. Resolves the deploy's
  PR (or commit) to show title, version, author, hash, duration, and a run link.
  Auto-fetches pipeline duration and (on failure) the failing step name via the
  GitHub Actions API — caller must grant `actions: read` on the notify job.
  Best-effort: with no webhook the action is a no-op and succeeds, so a missing
  webhook never fails the pipeline.

inputs:
  result:
    description: Result (success / failure), e.g. a deploy job's result.
    required: true
  webhook-url:
    description: Incoming webhook URL. Empty makes the action a no-op.
    required: false
    default: ""
  label:
    description: >-
      Short label for the message header (app / component name). Rendered
      alongside `version`. Prefer a bare name ("Backend") — the Slack
      channel already implies the environment.
    required: false
    default: Deployment
  version:
    description: Version string shown in the header, next to the label (e.g. `v2.1.0`).
    required: false
    default: ""
  deployed-url:
    description: >-
      Fully-qualified URL of the deployed app (shown only on success). The card
      strips protocol and trailing slash for display, and links back to the full
      URL. Caller resolves per-environment.
    required: false
    default: ""
  header:
    description: >-
      Full header line, verbatim. When set, switches the card into alert mode:
      the redesigned deploy card is replaced with an attachments-wrapper alert
      card whose title is this string and whose bar color is `color`. Used by
      `actions/enforce` and other non-deploy callers. May contain Slack emoji
      shortcodes. Setting any of `header` / `color` / `status` enables alert
      mode; leave all three empty for the standard deploy card.
    required: false
    default: ""
  color:
    description: >-
      Attachment bar color (hex, e.g. `"#F9A825"`). Only takes effect in alert
      mode (any of `header` / `color` / `status` set). Overrides the
      result-derived green/red.
    required: false
    default: ""
  status:
    description: >-
      When set, the alert card's first field renders as `*Status*\n<status>` in
      place of `*Version*\n<version>`. Only takes effect in alert mode.
    required: false
    default: ""
  channel:
    description: "Chat channel: slack (only slack implemented today)."
    required: false
    default: slack
  github-token:
    description: >-
      Token used to read the PR/commit, the workflow run, and (on failure) the
      run's jobs. Same-repo deploy: the default job token is enough. Cross-org
      deploy: pass a token minted in the caller from a GitHub App with read
      access to target-repo. Requires `actions: read` on the notify job.
    required: false
    default: ${{ github.token }}
  target-repo:
    description: >-
      owner/repo whose PR/commit the card describes. Defaults to the repo the
      workflow runs in; override for a cross-repo deploy.
    required: false
    default: ${{ github.repository }}
  target-sha:
    description: >-
      The exact commit SHA that was built & deployed, used to resolve the PR /
      commit shown on the card. Defaults to this workflow's commit.
    required: false
    default: ${{ github.sha }}
  run-token:
    description: >-
      Token used ONLY for the /actions/runs/{id} + /jobs API calls that
      populate DURATION and FAILED AT. Defaults to `github-token` (fine when
      that token has `actions: read` on the current repo). Override when
      `github-token` is a cross-org token minted for `target-repo` and thus
      has no access to the current repo's Actions API: pass
      `${{ github.token }}` so the run metadata is read with the job's own
      token. Requires `actions: read` on the notify job.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Post to Slack
      if: inputs.channel == 'slack'
      shell: bash
      env:
        RESULT: ${{ inputs.result }}
        LABEL: ${{ inputs.label }}
        VERSION: ${{ inputs.version }}
        DEPLOYED_URL: ${{ inputs.deployed-url }}
        HEADER_IN: ${{ inputs.header }}
        COLOR_IN: ${{ inputs.color }}
        STATUS_IN: ${{ inputs.status }}
        WEBHOOK: ${{ inputs.webhook-url }}
        TARGET_REPO: ${{ inputs.target-repo }}
        TARGET_SHA: ${{ inputs.target-sha }}
        RUN_REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        GH_TOKEN: ${{ inputs.github-token }}
        RUN_TOKEN: ${{ inputs.run-token }}
      run: |
        set -uo pipefail

        if [ -z "${WEBHOOK:-}" ]; then
          echo "No SLACK_WEBHOOK_URL configured; skipping notification."
          exit 0
        fi

        # Runs live in github.repository (RUN_REPO), even when target-repo is
        # a cross-org repo for PR attribution. Fall the run-token back to the
        # PR-attribution token so single-repo callers keep working unchanged.
        RUN_TOKEN="${RUN_TOKEN:-$GH_TOKEN}"

        # Status icon only. Header emoji conveys success/failure — no separate
        # subtitle line under it.
        icon=":x:"; is_success=0
        if [ "${RESULT:-}" = "success" ]; then
          icon=":white_check_mark:"; is_success=1
        fi

        version="${VERSION:-}"; [ -z "$version" ] && version="n/a"
        short_sha="${TARGET_SHA:0:7}"
        built_utc="$(date -u +%Y-%m-%d)"

        # -- Alert mode: header/color/status swap the redesigned deploy card
        # for an attachments-wrapper alert card. Byte-identical to the pre-v4
        # notify card, so the actions/enforce alert path (#20) survives v4.
        # Skips the run/jobs fetch entirely — DURATION and FAILED AT are
        # deploy-only.
        if [ -n "${HEADER_IN:-}" ] || [ -n "${COLOR_IN:-}" ] || [ -n "${STATUS_IN:-}" ]; then
          a_emoji=":x:"; a_color="#D32F2F"; a_status="failed"
          if [ "${RESULT:-}" = "success" ]; then
            a_emoji=":white_check_mark:"; a_color="#2E7D32"; a_status="succeeded"
          fi
          header="${HEADER_IN:-${a_emoji} ${LABEL} — ${a_status}}"
          [ -n "${COLOR_IN:-}" ] && a_color="$COLOR_IN"
          if [ -n "${STATUS_IN:-}" ]; then
            f1label="Status"; f1value="$STATUS_IN"
          else
            f1label="Version"; f1value="$version"
          fi

          pr_json="$(gh api "repos/${TARGET_REPO}/commits/${TARGET_SHA}/pulls" -H "Accept: application/vnd.github+json" 2>/dev/null || echo '[]')"
          sel="$(jq -c 'if (type=="array" and length>0) then ([.[]|select(.merged_at!=null)][0] // .[0]) else {} end' <<<"$pr_json")"
          pr_num="$(jq -r '.number // empty' <<<"$sel")"

          if [ -n "$pr_num" ]; then
            pr_title="$(jq -r '.title // ""' <<<"$sel")"
            pr_url="$(jq -r '.html_url // ""' <<<"$sel")"
            pr_user="$(jq -r '.user.login // "unknown"' <<<"$sel")"
            payload="$(jq -n \
              --arg color "$a_color" --arg header "$header" \
              --arg f1label "$f1label" --arg f1value "$f1value" \
              --arg prlabel "${TARGET_REPO}#${pr_num}" --arg title "$pr_title" \
              --arg user "$pr_user" --arg runurl "$RUN_URL" --arg prurl "$pr_url" \
              --arg built "$built_utc" '
              def esc: gsub("&";"&amp;") | gsub("<";"&lt;") | gsub(">";"&gt;");
              { attachments: [{ color: $color, blocks: [
                  { type:"header", text:{ type:"plain_text", text:$header, emoji:true } },
                  { type:"section", fields:[
                      { type:"mrkdwn", text:("*" + $f1label + "*\n" + $f1value) },
                      { type:"mrkdwn", text:("*PR*\n" + (if $prurl != "" then "<" + $prurl + "|" + $prlabel + ">" else $prlabel end)) } ]},
                  { type:"section", text:{ type:"mrkdwn", text:("*" + ($title|esc) + "*") } },
                  { type:"context", elements:[
                      { type:"mrkdwn", text:("👤 " + ($user|esc) + "   ·   📅 " + $built + " UTC   ·   🔗 <" + $runurl + "|view run>") } ]}
              ]}]}')"
          else
            commit_json="$(gh api "repos/${TARGET_REPO}/commits/${TARGET_SHA}" 2>/dev/null || echo '{}')"
            c_subject="$(jq -r '.commit.message // "" | split("\n")[0] // ""' <<<"$commit_json")"
            c_author="$(jq -r '.commit.author.name // .author.login // "unknown"' <<<"$commit_json")"
            c_url="$(jq -r '.html_url // ""' <<<"$commit_json")"
            if [ -n "$c_subject" ]; then
              payload="$(jq -n \
                --arg color "$a_color" --arg header "$header" \
                --arg f1label "$f1label" --arg f1value "$f1value" \
                --arg short "$short_sha" --arg cmurl "$c_url" \
                --arg subject "$c_subject" --arg user "$c_author" --arg runurl "$RUN_URL" \
                --arg built "$built_utc" '
                def esc: gsub("&";"&amp;") | gsub("<";"&lt;") | gsub(">";"&gt;");
                { attachments: [{ color: $color, blocks: [
                    { type:"header", text:{ type:"plain_text", text:$header, emoji:true } },
                    { type:"section", fields:[
                        { type:"mrkdwn", text:("*" + $f1label + "*\n" + $f1value) },
                        { type:"mrkdwn", text:("*Commit*\n" + (if $cmurl != "" then "<" + $cmurl + "|" + $short + ">" else "`" + $short + "`" end)) } ]},
                    { type:"section", text:{ type:"mrkdwn", text:("*" + ($subject|esc) + "*") } },
                    { type:"context", elements:[
                        { type:"mrkdwn", text:("👤 " + ($user|esc) + "   ·   📅 " + $built + " UTC   ·   🔗 <" + $runurl + "|view run>") } ]}
                ]}]}')"
            else
              payload="$(jq -n --arg text "${a_emoji} ${LABEL}: ${a_status}  |  version \`${version}\`  |  📅 ${built_utc} UTC  |  <${RUN_URL}|view run>" '{ text: $text }')"
            fi
          fi

          if curl -fsS -X POST -H 'Content-Type: application/json' --data "$payload" "$WEBHOOK" >/dev/null; then
            echo "Slack notification sent."
          else
            echo "Slack notification failed (ignored, best-effort)."
          fi
          exit 0
        fi

        # -- Duration: pull run_started_at, compute elapsed vs now.
        # Falls back silently if the API call fails.
        duration=""
        run_json="$(GH_TOKEN="$RUN_TOKEN" gh api "repos/${RUN_REPO}/actions/runs/${RUN_ID}" 2>/dev/null || echo '{}')"
        started_at="$(jq -r '.run_started_at // .created_at // empty' <<<"$run_json")"
        if [ -z "$started_at" ]; then
          echo "::warning::notify: /actions/runs/${RUN_ID} in ${RUN_REPO} returned no run_started_at. Check that the notify job grants 'actions: read' and (for cross-org callers) run-token has access — DURATION will not render."
        fi
        if [ -n "$started_at" ]; then
          started_epoch="$(date -u -d "$started_at" +%s 2>/dev/null || echo '')"
          if [ -n "$started_epoch" ]; then
            now_epoch="$(date -u +%s)"
            elapsed=$(( now_epoch - started_epoch ))
            if [ "$elapsed" -lt 0 ]; then elapsed=0; fi
            if [ "$elapsed" -lt 60 ]; then
              duration="${elapsed}s"
            else
              duration="$((elapsed / 60))m $((elapsed % 60))s"
            fi
          fi
        fi

        # -- Failed job name: the first pipeline stage (job) with conclusion=failure.
        # We surface the JOB name — not a step name — because inner steps of
        # composite actions are opaque to the /jobs endpoint (only the outer
        # `Run owner/repo/actions/name@ref` wrapper is visible), which makes
        # step-level names misleading. Job names ("Build", "Deploy", …) are
        # always human-meaningful and match what users see in the Actions UI.
        failed_step=""
        if [ "$is_success" -eq 0 ]; then
          jobs_json="$(GH_TOKEN="$RUN_TOKEN" gh api "repos/${RUN_REPO}/actions/runs/${RUN_ID}/jobs" 2>/dev/null || echo '{}')"
          if [ "$(jq -r '(.jobs // []) | length' <<<"$jobs_json")" = "0" ]; then
            echo "::warning::notify: /actions/runs/${RUN_ID}/jobs in ${RUN_REPO} returned no jobs. Check that the notify job grants 'actions: read' and (for cross-org callers) run-token has access — FAILED AT will not render."
          fi
          failed_step="$(jq -r '[.jobs[]? | select(.conclusion == "failure")] | .[0].name // ""' <<<"$jobs_json")"
        fi

        # -- Resolve PR (preferred) or commit for the header rows.
        pr_json="$(gh api "repos/${TARGET_REPO}/commits/${TARGET_SHA}/pulls" \
          -H "Accept: application/vnd.github+json" 2>/dev/null || echo '[]')"
        sel="$(jq -c 'if (type=="array" and length>0) then ([.[]|select(.merged_at!=null)][0] // .[0]) else {} end' <<<"$pr_json")"
        pr_num="$(jq -r '.number // empty' <<<"$sel")"

        commit_json="$(gh api "repos/${TARGET_REPO}/commits/${TARGET_SHA}" 2>/dev/null || echo '{}')"
        commit_subject="$(jq -r '.commit.message // "" | split("\n")[0] // ""' <<<"$commit_json")"
        # Prefer git-metadata display name over the raw GitHub login.
        commit_author="$(jq -r '.commit.author.name // .author.login // "unknown"' <<<"$commit_json")"
        commit_url="$(jq -r '.html_url // ""' <<<"$commit_json")"

        if [ -n "$pr_num" ]; then
          pr_title="$(jq -r '.title // ""' <<<"$sel")"
          pr_url="$(jq -r '.html_url // ""' <<<"$sel")"
          pr_label="${TARGET_REPO}#${pr_num}"
          # PR title beats commit subject when available.
          [ -n "$pr_title" ] && commit_subject="$pr_title"
        else
          pr_url=""; pr_label=""
        fi

        # -- URL display: strip protocol + trailing slash.
        url_display=""
        if [ -n "${DEPLOYED_URL:-}" ]; then
          url_display="$(printf '%s' "$DEPLOYED_URL" | sed -E 's|^https?://||; s|/+$||')"
        fi

        # Fallback path: neither PR nor commit resolved → single-line message.
        if [ -z "$commit_subject" ] && [ -z "$pr_num" ]; then
          payload="$(jq -n \
            --arg text "${icon} ${LABEL} ${version}  |  📅 ${built_utc} UTC  |  <${RUN_URL}|view run>" \
            '{ text: $text }')"
        else
          # -- Single full-width mrkdwn section with monospace-padded labels.
          # Slack's section.fields is a 2-col grid ~50/50; the value column is
          # only ~30 chars, which wrapped long commit subjects and PR refs.
          # Wrapping each label in inline code (`) forces monospace, so we can
          # right-pad to a fixed 9-char column ("FAILED AT" is the longest at
          # 9). That preserves the aligned-column look while giving the value
          # column the full card width — long values no longer wrap.
          # `-r` is required so the joined newlines survive raw to the outer jq.
          rows_text="$(jq -n -r \
            --arg is_success "$is_success" \
            --arg failed_step "$failed_step" \
            --arg subject "$commit_subject" \
            --arg pr_label "$pr_label" --arg pr_url "$pr_url" \
            --arg author "$commit_author" \
            --arg short_sha "$short_sha" --arg commit_url "$commit_url" \
            --arg duration "$duration" \
            --arg built "$built_utc" \
            --arg url_display "$url_display" --arg url_full "$DEPLOYED_URL" '
            def esc: gsub("&";"&amp;") | gsub("<";"&lt;") | gsub(">";"&gt;");
            # MAINTENANCE RISK. The padlabel scheme below is empirically tuned to
            # Slacks Lato font at current rendering sizes  any Slack renderer
            # change and column alignment drifts silently (visible only on
            # screenshot review, not in any test signal). If durability matters
            # more than fidelity, the safe fallback is a plain bold-then-value
            # render: replace padlabel(k) + v with "*" + k + "*\n" + v.
            # `label` is a jq reserved keyword (label/break), so name this `padlabel`.
            # Two-space padding scheme for column alignment in Slack Lato:
            #   1. Em space (\u2003 = 1 em)     \u2014 pad to 12 chars total.
            #   2. NBSP     (\u00a0 = ~0.25 em) \u2014 add N per label = label length.
            # In Slack Lato, bold letter width is ~0.75 em, em space is 1 em, NBSP
            # is ~0.25 em. Total row width = L*0.75 + (12-L)*1 + L*0.25 = 12 em,
            # constant across all label lengths. Pure em-space padding drifted
            # because bold letter (0.75) < em (1), so longer labels came out
            # narrower \u2014 visible as DURATION (8 chars) drifting left of PR (2).
            # The per-label NBSP tail scales with L to make up the missing 0.25 em
            # per bold letter, so DURATION gets the largest NBSP tail.
            # NOTE: no apostrophes in these comments  the outer shell context
            # is a single-quoted jq expression and an apostrophe would close it.
            def padlabel(k):
              (k | length) as $L
              # Empirical shave: COMMIT / AUTHOR / DURATION are all-caps single
              # words dominated by wide bold letters (M, D, U, R, A, O, N), so
              # under the analytical formula their rendered width overshoots
              # the reference column formed by the other labels. Drop 2 NBSPs
              # from those three to pull their values back into the same X.
              | (if k == "COMMIT" or k == "AUTHOR" or k == "DURATION" then 2 elif k == "PR" or k == "FAILED AT" then -2 else 0 end) as $shave
              | "*" + k + "*"
                + "\u2003" * (if 12 - $L > 0 then 12 - $L else 0 end)
                + "\u00a0" * ($L - $shave);
            def row(k; v): padlabel(k) + v;

            ( if $is_success == "0" and $failed_step != "" then
                [ row("FAILED AT"; ($failed_step|esc)) ]
              else [] end )
            + ( if $subject != "" then [ row("COMMIT"; ($subject|esc)) ] else [] end )
            + ( if $pr_label != "" then
                  [ row("PR"; (if $pr_url != "" then "<" + $pr_url + "|" + $pr_label + ">" else $pr_label end)) ]
                else [] end )
            + [ row("AUTHOR"; ($author|esc)) ]
            + [ row("HASH"; (if $commit_url != "" then "<" + $commit_url + "|`" + $short_sha + "`>" else "`" + $short_sha + "`" end)) ]
            + ( if $duration != "" then [ row("DURATION"; $duration) ] else [] end )
            + [ row("DATE"; ($built + " UTC")) ]
            + ( if $is_success == "1" and $url_display != "" then
                  [ row("URL"; "<" + $url_full + "|" + $url_display + ">") ]
                else [] end )
            | join("\n\n")
          ')"

          # Header emoji conveys status; no separate context/subtitle block.
          payload="$(jq -n \
            --arg icon "$icon" --arg label "$LABEL" --arg version "$version" \
            --arg runurl "$RUN_URL" \
            --arg rows_text "$rows_text" '
            { blocks:
              [ { type:"header", text:{ type:"plain_text", text:($icon + " " + $label + " " + $version), emoji:true } },
                { type:"section", text:{ type:"mrkdwn", text: $rows_text } },
                { type:"actions", elements:[
                    { type:"button",
                      text:{ type:"plain_text", text:"View run" },
                      url: $runurl } ] } ]
            }')"
        fi

        # -f makes curl fail on HTTP >=400 so Slack payload rejections surface in
        # the log instead of being silently reported as a successful send.
        if curl -fsS -X POST -H 'Content-Type: application/json' --data "$payload" "$WEBHOOK" >/dev/null; then
          echo "Slack notification sent."
        else
          echo "Slack notification failed (ignored, best-effort)."
        fi
        exit 0
