name: Notify
description: >-
  Post a pipeline result to a chat channel as a rich card. Resolves the deploy's
  PR (or commit) to show title, version, author and a run link. Best-effort:
  with no webhook the action is a no-op and succeeds, so a missing webhook never
  fails the pipeline. The PR/commit lookup needs `pull-requests: read` and
  `contents: read` on the calling job; without them the card silently falls back
  to commit-only details.

inputs:
  result:
    description: Result (success / failure), e.g. a deploy job's result.
    required: true
  webhook-url:
    description: Incoming webhook URL. Empty makes the action a no-op.
    required: false
    default: ""
  label:
    description: Short label for the message (app / component name).
    required: false
    default: Deployment
  version:
    description: Version string shown in the message.
    required: false
    default: ""
  header:
    description: >-
      Full header line, verbatim. When set, overrides the default
      "<emoji> <label> — <succeeded|failed>" header — for alert cards that need
      a custom title (e.g. a revert notice). May contain Slack emoji shortcodes.
    required: false
    default: ""
  color:
    description: >-
      Attachment bar color (hex, e.g. "#F9A825"). When set, overrides the
      result-derived green/red — lets alert callers signal a state that isn't a
      clean pass/fail.
    required: false
    default: ""
  status:
    description: >-
      When set, the first card field renders as "*Status*\n<status>" in place of
      "*Version*\n<version>". For alert cards where a version is meaningless.
    required: false
    default: ""
  channel:
    description: "Chat channel: slack (only slack implemented today)."
    required: false
    default: slack
  github-token:
    description: >-
      Token used to read the PR / commit that this deploy traces to. For a
      same-repo deploy the default job token is enough; for a cross-org deploy
      (target-repo differs from this repo) pass a token minted in the caller
      from a GitHub App with read access to target-repo.
    required: false
    default: ${{ github.token }}
  target-repo:
    description: >-
      owner/repo whose PR/commit the card describes. Defaults to the repo the
      workflow runs in; override for a cross-repo deploy.
    required: false
    default: ${{ github.repository }}
  target-sha:
    description: >-
      The exact commit SHA that was built & deployed, used to resolve the PR /
      commit shown on the card. Defaults to this workflow's commit.
    required: false
    default: ${{ github.sha }}

runs:
  using: composite
  steps:
    - name: Post to Slack
      if: inputs.channel == 'slack'
      shell: bash
      env:
        RESULT: ${{ inputs.result }}
        LABEL: ${{ inputs.label }}
        VERSION: ${{ inputs.version }}
        HEADER_IN: ${{ inputs.header }}
        COLOR_IN: ${{ inputs.color }}
        STATUS_IN: ${{ inputs.status }}
        WEBHOOK: ${{ inputs.webhook-url }}
        TARGET_REPO: ${{ inputs.target-repo }}
        TARGET_SHA: ${{ inputs.target-sha }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -uo pipefail

        if [ -z "${WEBHOOK:-}" ]; then
          echo "No SLACK_WEBHOOK_URL configured; skipping notification."
          exit 0
        fi

        emoji=":x:"; color="#D32F2F"; status="failed"
        if [ "${RESULT:-}" = "success" ]; then
          emoji=":white_check_mark:"; color="#2E7D32"; status="succeeded"
        fi
        version="${VERSION:-}"; [ -z "$version" ] && version="n/a"
        short_sha="${TARGET_SHA:0:7}"

        # Card chrome. Alert callers can override the header line and color bar,
        # and swap the first field from Version to Status. With none of these
        # inputs set, the result-derived defaults reproduce the original card
        # verbatim, so existing deploy callers are unaffected.
        header="${HEADER_IN:-${emoji} ${LABEL} — ${status}}"
        [ -n "${COLOR_IN:-}" ] && color="$COLOR_IN"
        if [ -n "${STATUS_IN:-}" ]; then
          field1_label="Status"; field1_value="$STATUS_IN"
        else
          field1_label="Version"; field1_value="$version"
        fi

        # Build date in UTC (YYYY.MM.DD), shown on the card so the deploy date is
        # unambiguous rather than inferred from Slack's local-timezone timestamp.
        built_utc="$(date -u +%Y.%m.%d)"

        # Prefer the PR this deploy traces to (a merge commit on dev/prod resolves
        # to its PR); fall back to the commit itself, then to a plain line.
        pr_json="$(gh api "repos/${TARGET_REPO}/commits/${TARGET_SHA}/pulls" \
          -H "Accept: application/vnd.github+json" 2>/dev/null || echo '[]')"
        sel="$(jq -c 'if (type=="array" and length>0) then ([.[]|select(.merged_at!=null)][0] // .[0]) else {} end' <<<"$pr_json")"
        pr_num="$(jq -r '.number // empty' <<<"$sel")"

        if [ -n "$pr_num" ]; then
          # PR card: title + number + link (no commit bullets).
          pr_title="$(jq -r '.title // ""' <<<"$sel")"
          pr_url="$(jq -r '.html_url // ""' <<<"$sel")"
          pr_user="$(jq -r '.user.login // "unknown"' <<<"$sel")"
          payload="$(jq -n \
            --arg color "$color" --arg header "$header" \
            --arg f1label "$field1_label" --arg f1value "$field1_value" \
            --arg prlabel "${TARGET_REPO}#${pr_num}" --arg title "$pr_title" \
            --arg user "$pr_user" --arg runurl "$RUN_URL" --arg prurl "$pr_url" \
            --arg built "$built_utc" '
            def esc: gsub("&";"&amp;") | gsub("<";"&lt;") | gsub(">";"&gt;");
            { attachments: [{ color: $color, blocks: [
                { type:"header", text:{ type:"plain_text", text:$header, emoji:true } },
                { type:"section", fields:[
                    { type:"mrkdwn", text:("*" + $f1label + "*\n" + $f1value) },
                    { type:"mrkdwn", text:("*PR*\n" + (if $prurl != "" then "<" + $prurl + "|" + $prlabel + ">" else $prlabel end)) } ]},
                { type:"section", text:{ type:"mrkdwn", text:("*" + ($title|esc) + "*") } },
                { type:"context", elements:[
                    { type:"mrkdwn", text:("👤 " + ($user|esc) + "   ·   📅 " + $built + " UTC   ·   🔗 <" + $runurl + "|view run>") } ]}
            ]}]}')"
        else
          # No PR -> show the commit that triggered this deploy (target-sha).
          commit_json="$(gh api "repos/${TARGET_REPO}/commits/${TARGET_SHA}" 2>/dev/null || echo '{}')"
          c_subject="$(jq -r '.commit.message // "" | split("\n")[0] // ""' <<<"$commit_json")"
          c_author="$(jq -r '.author.login // .commit.author.name // "unknown"' <<<"$commit_json")"
          c_url="$(jq -r '.html_url // ""' <<<"$commit_json")"

          if [ -n "$c_subject" ]; then
            # Commit card: subject + short SHA (linked) + author.
            payload="$(jq -n \
              --arg color "$color" --arg header "$header" \
              --arg f1label "$field1_label" --arg f1value "$field1_value" \
              --arg short "$short_sha" --arg cmurl "$c_url" \
              --arg subject "$c_subject" --arg user "$c_author" --arg runurl "$RUN_URL" \
              --arg built "$built_utc" '
              def esc: gsub("&";"&amp;") | gsub("<";"&lt;") | gsub(">";"&gt;");
              { attachments: [{ color: $color, blocks: [
                  { type:"header", text:{ type:"plain_text", text:$header, emoji:true } },
                  { type:"section", fields:[
                      { type:"mrkdwn", text:("*" + $f1label + "*\n" + $f1value) },
                      { type:"mrkdwn", text:("*Commit*\n" + (if $cmurl != "" then "<" + $cmurl + "|" + $short + ">" else "`" + $short + "`" end)) } ]},
                  { type:"section", text:{ type:"mrkdwn", text:("*" + ($subject|esc) + "*") } },
                  { type:"context", elements:[
                      { type:"mrkdwn", text:("👤 " + ($user|esc) + "   ·   📅 " + $built + " UTC   ·   🔗 <" + $runurl + "|view run>") } ]}
              ]}]}')"
          else
            # Fallback - nothing resolved: original single-line text format.
            payload="$(jq -n \
              --arg text "${emoji} ${LABEL}: ${status}  |  version \`${version}\`  |  📅 ${built_utc} UTC  |  <${RUN_URL}|view run>" \
              '{ text: $text }')"
          fi
        fi

        # -f makes curl fail on HTTP >=400 so Slack payload rejections surface in
        # the log instead of being silently reported as a successful send.
        if curl -fsS -X POST -H 'Content-Type: application/json' --data "$payload" "$WEBHOOK" >/dev/null; then
          echo "Slack notification sent."
        else
          echo "Slack notification failed (ignored, best-effort)."
        fi
        exit 0
