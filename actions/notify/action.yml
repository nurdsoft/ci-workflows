name: Notify
description: >-
  Post a pipeline result to a chat channel. Best-effort: with no webhook the
  action is a no-op and succeeds, so a missing webhook never fails the pipeline.

inputs:
  result:
    description: Result (success / failure), e.g. a deploy job's result.
    required: true
  webhook-url:
    description: Incoming webhook URL. Empty makes the action a no-op.
    required: false
    default: ""
  label:
    description: Short label for the message (app / component name).
    required: false
    default: Deployment
  version:
    description: Version string shown in the message.
    required: false
    default: ""
  channel:
    description: "Chat channel: slack (only slack implemented today)."
    required: false
    default: slack

runs:
  using: composite
  steps:
    - name: Post to Slack
      if: inputs.webhook-url != '' && inputs.channel == 'slack'
      uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c  # v3.0.3
      with:
        webhook-type: incoming-webhook
        payload: |
          {
            "text": "${{ inputs.result == 'success' && ':white_check_mark:' || ':x:' }} ${{ inputs.label }}: ${{ inputs.result == 'success' && 'succeeded' || 'failed' }}  |  version `${{ inputs.version || 'n/a' }}`  |  <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view run>"
          }
      env:
        SLACK_WEBHOOK_URL: ${{ inputs.webhook-url }}
