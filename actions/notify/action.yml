name: Notify
description: >-
  Post a pipeline result to a chat channel. Best-effort: with no webhook the
  action is a no-op and succeeds, so a missing webhook never fails the pipeline.

inputs:
  result:
    description: Result (success / failure), e.g. a deploy job's result.
    required: true
  webhook-url:
    description: Incoming webhook URL. Empty makes the action a no-op.
    required: false
    default: ""
  label:
    description: Short label for the message (app / component name), e.g. "Frontend".
    required: false
    default: Deployment
  version:
    description: Optional version string; shown as an extra line when provided.
    required: false
    default: ""
  channel:
    description: "Chat channel: slack (only slack implemented today)."
    required: false
    default: slack
  github-token:
    description: >-
      Token used to resolve the deployer's display name via the GitHub API.
      Falls back to the actor's username when empty or the lookup fails.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Compose the whole payload here with jq so every interpolated value
    # (commit title, deployer, version) is JSON-escaped — a quote or backslash
    # in a commit message can never produce invalid JSON. Optional lines are
    # only added when their data is present, so non-deploy announces (manual
    # dispatch, DNS cutover) stay clean instead of showing empty fields.
    - name: Build Slack payload
      id: prep
      if: inputs.webhook-url != '' && inputs.channel == 'slack'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RESULT: ${{ inputs.result }}
        LABEL: ${{ inputs.label }}
        VERSION: ${{ inputs.version }}
        ACTOR: ${{ github.actor }}
        COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
      run: |
        # Result-based visuals.
        if [ "$RESULT" = "success" ]; then
          COLOR="#36a64f"; STYLE="primary"
          HEADER=":white_check_mark: *${LABEL} Deployed Successfully*"
        else
          COLOR="#ff0000"; STYLE="danger"
          HEADER=":x: *${LABEL} Deployment Failed*"
        fi

        # Build the mrkdwn body as a list of lines; lines with no data are
        # never appended, so a manual/DNS announce stays clean. jq joins and
        # escapes them, so the body is valid JSON regardless of content.
        LINES=("$HEADER")

        # Commit title: prefer the checked-out repo, fall back to the push
        # payload. May be empty (e.g. workflow_dispatch with no checkout) — in
        # that case the commit line is skipped entirely.
        TITLE=$(git log -1 --pretty=format:%s 2>/dev/null || true)
        if [ -z "$TITLE" ]; then
          TITLE=$(printf '%s' "$HEAD_COMMIT_MSG" | head -n1)
        fi
        [ -n "$TITLE" ] && LINES+=("*Commit Message:* <${COMMIT_URL}|${TITLE}>")

        # Deployer display name: GitHub API name, fall back to the username.
        REAL_NAME=""
        if [ -n "$GH_TOKEN" ]; then
          REAL_NAME=$(gh api "users/${ACTOR}" --jq '.name' 2>/dev/null || true)
        fi
        if [ -z "$REAL_NAME" ] || [ "$REAL_NAME" = "null" ]; then
          REAL_NAME="$ACTOR"
        fi
        [ -n "$REAL_NAME" ] && LINES+=("*Deployed By:* \`${REAL_NAME}\`")

        [ -n "$VERSION" ] && LINES+=("*Version:* \`${VERSION}\`")

        # jq joins the lines with real newlines (encoded as \n in JSON) and
        # escapes every value — a quote or backslash anywhere can never break
        # the payload.
        PAYLOAD=$(jq -nc \
          --arg color "$COLOR" \
          --arg style "$STYLE" \
          --arg url "$RUN_URL" \
          '{
            attachments: [
              {
                color: $color,
                blocks: [
                  { type: "section", text: { type: "mrkdwn", text: ($ARGS.positional | join("\n")) } },
                  { type: "actions", elements: [
                    { type: "button",
                      text: { type: "plain_text", text: "View Pipeline Run" },
                      style: $style,
                      url: $url }
                  ] }
                ]
              }
            ]
          }' \
          --args "${LINES[@]}")

        {
          echo "payload<<PAYLOAD_EOF"
          echo "$PAYLOAD"
          echo "PAYLOAD_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Post to Slack
      if: inputs.webhook-url != '' && inputs.channel == 'slack'
      uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c  # v3.0.3
      with:
        webhook-type: incoming-webhook
        payload: ${{ steps.prep.outputs.payload }}
      env:
        SLACK_WEBHOOK_URL: ${{ inputs.webhook-url }}
