name: Notify
description: >-
  Post a pipeline result to a chat channel as a rich card. Resolves the deploy's
  PR (or commit) to show title, version, author, hash, duration, and a run link.
  Auto-fetches pipeline duration and (on failure) the failing step name via the
  GitHub Actions API — caller must grant `actions: read` on the notify job.
  Best-effort: with no webhook the action is a no-op and succeeds, so a missing
  webhook never fails the pipeline.

inputs:
  result:
    description: Result (success / failure), e.g. a deploy job's result.
    required: true
  webhook-url:
    description: Incoming webhook URL. Empty makes the action a no-op.
    required: false
    default: ""
  label:
    description: >-
      Short label for the message header (app / component name). Rendered
      alongside `version`. Prefer a bare name ("Commerce Backend") — the Slack
      channel already implies the environment.
    required: false
    default: Deployment
  version:
    description: Version string shown in the header, next to the label (e.g. `v2.1.0`).
    required: false
    default: ""
  deployed-url:
    description: >-
      Fully-qualified URL of the deployed app (shown only on success). The card
      strips protocol and trailing slash for display, and links back to the full
      URL. Caller resolves per-environment.
    required: false
    default: ""
  channel:
    description: "Chat channel: slack (only slack implemented today)."
    required: false
    default: slack
  github-token:
    description: >-
      Token used to read the PR/commit, the workflow run, and (on failure) the
      run's jobs. Same-repo deploy: the default job token is enough. Cross-org
      deploy: pass a token minted in the caller from a GitHub App with read
      access to target-repo. Requires `actions: read` on the notify job.
    required: false
    default: ${{ github.token }}
  target-repo:
    description: >-
      owner/repo whose PR/commit the card describes. Defaults to the repo the
      workflow runs in; override for a cross-repo deploy.
    required: false
    default: ${{ github.repository }}
  target-sha:
    description: >-
      The exact commit SHA that was built & deployed, used to resolve the PR /
      commit shown on the card. Defaults to this workflow's commit.
    required: false
    default: ${{ github.sha }}

runs:
  using: composite
  steps:
    - name: Post to Slack
      if: inputs.channel == 'slack'
      shell: bash
      env:
        RESULT: ${{ inputs.result }}
        LABEL: ${{ inputs.label }}
        VERSION: ${{ inputs.version }}
        DEPLOYED_URL: ${{ inputs.deployed-url }}
        WEBHOOK: ${{ inputs.webhook-url }}
        TARGET_REPO: ${{ inputs.target-repo }}
        TARGET_SHA: ${{ inputs.target-sha }}
        RUN_ID: ${{ github.run_id }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -uo pipefail

        if [ -z "${WEBHOOK:-}" ]; then
          echo "No SLACK_WEBHOOK_URL configured; skipping notification."
          exit 0
        fi

        # Status icon only. Header emoji conveys success/failure — no separate
        # subtitle line under it.
        icon=":x:"; is_success=0
        if [ "${RESULT:-}" = "success" ]; then
          icon=":white_check_mark:"; is_success=1
        fi

        version="${VERSION:-}"; [ -z "$version" ] && version="n/a"
        short_sha="${TARGET_SHA:0:7}"
        built_utc="$(date -u +%Y.%m.%d)"

        # -- Duration: pull run_started_at, compute elapsed vs now.
        # Falls back silently if the API call fails.
        duration=""
        run_json="$(gh api "repos/${TARGET_REPO}/actions/runs/${RUN_ID}" 2>/dev/null || echo '{}')"
        started_at="$(jq -r '.run_started_at // .created_at // empty' <<<"$run_json")"
        if [ -n "$started_at" ]; then
          started_epoch="$(date -u -d "$started_at" +%s 2>/dev/null || echo '')"
          if [ -n "$started_epoch" ]; then
            now_epoch="$(date -u +%s)"
            elapsed=$(( now_epoch - started_epoch ))
            if [ "$elapsed" -lt 0 ]; then elapsed=0; fi
            if [ "$elapsed" -lt 60 ]; then
              duration="${elapsed}s"
            else
              duration="$((elapsed / 60))m $((elapsed % 60))s"
            fi
          fi
        fi

        # -- Failed job name: the first pipeline stage (job) with conclusion=failure.
        # We surface the JOB name — not a step name — because inner steps of
        # composite actions are opaque to the /jobs endpoint (only the outer
        # `Run owner/repo/actions/name@ref` wrapper is visible), which makes
        # step-level names misleading. Job names ("Build", "Deploy", …) are
        # always human-meaningful and match what users see in the Actions UI.
        failed_step=""
        if [ "$is_success" -eq 0 ]; then
          jobs_json="$(gh api "repos/${TARGET_REPO}/actions/runs/${RUN_ID}/jobs" 2>/dev/null || echo '{}')"
          failed_step="$(jq -r '[.jobs[]? | select(.conclusion == "failure")] | .[0].name // ""' <<<"$jobs_json")"
        fi

        # -- Resolve PR (preferred) or commit for the header rows.
        pr_json="$(gh api "repos/${TARGET_REPO}/commits/${TARGET_SHA}/pulls" \
          -H "Accept: application/vnd.github+json" 2>/dev/null || echo '[]')"
        sel="$(jq -c 'if (type=="array" and length>0) then ([.[]|select(.merged_at!=null)][0] // .[0]) else {} end' <<<"$pr_json")"
        pr_num="$(jq -r '.number // empty' <<<"$sel")"

        commit_json="$(gh api "repos/${TARGET_REPO}/commits/${TARGET_SHA}" 2>/dev/null || echo '{}')"
        commit_subject="$(jq -r '.commit.message // "" | split("\n")[0] // ""' <<<"$commit_json")"
        # Prefer git-metadata display name over the raw GitHub login.
        commit_author="$(jq -r '.commit.author.name // .author.login // "unknown"' <<<"$commit_json")"
        commit_url="$(jq -r '.html_url // ""' <<<"$commit_json")"

        if [ -n "$pr_num" ]; then
          pr_title="$(jq -r '.title // ""' <<<"$sel")"
          pr_url="$(jq -r '.html_url // ""' <<<"$sel")"
          pr_label="${TARGET_REPO}#${pr_num}"
          # PR title beats commit subject when available.
          [ -n "$pr_title" ] && commit_subject="$pr_title"
        else
          pr_url=""; pr_label=""
        fi

        # -- URL display: strip protocol + trailing slash.
        url_display=""
        if [ -n "${DEPLOYED_URL:-}" ]; then
          url_display="$(printf '%s' "$DEPLOYED_URL" | sed -E 's|^https?://||; s|/+$||')"
        fi

        # Fallback path: neither PR nor commit resolved → single-line message.
        if [ -z "$commit_subject" ] && [ -z "$pr_num" ]; then
          payload="$(jq -n \
            --arg text "${icon} ${LABEL} ${version}  |  📅 ${built_utc} UTC  |  <${RUN_URL}|view run>" \
            '{ text: $text }')"
        else
          # -- Single full-width mrkdwn section with monospace-padded labels.
          # Slack's section.fields is a 2-col grid ~50/50; the value column is
          # only ~30 chars, which wrapped long commit subjects and PR refs.
          # Wrapping each label in inline code (`) forces monospace, so we can
          # right-pad to a fixed 9-char column ("FAILED AT" is the longest at
          # 9). That preserves the aligned-column look while giving the value
          # column the full card width — long values no longer wrap.
          # `-r` is required so the joined newlines survive raw to the outer jq.
          rows_text="$(jq -n -r \
            --arg is_success "$is_success" \
            --arg failed_step "$failed_step" \
            --arg subject "$commit_subject" \
            --arg pr_label "$pr_label" --arg pr_url "$pr_url" \
            --arg author "$commit_author" \
            --arg short_sha "$short_sha" --arg commit_url "$commit_url" \
            --arg duration "$duration" \
            --arg built "$built_utc" \
            --arg url_display "$url_display" --arg url_full "$DEPLOYED_URL" '
            def esc: gsub("&";"&amp;") | gsub("<";"&lt;") | gsub(">";"&gt;");
            # `label` is a jq reserved keyword (label/break), so name this `padlabel`.
            # Bold label + trailing EM SPACE (\u2003) padding for column alignment.
            # An em space is the fonts em width (~font size in px), which in
            # Slacks Lato font renders at roughly the same visual width as a
            # bold letter. So `bold_char_width * N_letters + em_width * N_padding`
            # collapses to ~`em_width * (N_letters + N_padding)` = constant for
            # all labels padded to 12 chars total. NBSPs were tried first but
            # render narrower than bold letters, which caused labels with more
            # bold chars (COMMIT, AUTHOR) to visibly drift right relative to
            # short-label rows (URL, PR).
            # NOTE: no apostrophes in these comments  the outer shell context
            # is a single-quoted jq expression and an apostrophe would close it.
            def padlabel(k): "*" + k + "*" + (((12 - (k|length)) as $n | if $n > 0 then "\u2003" * $n else "\u2003" end));
            def row(k; v): padlabel(k) + v;

            ( if $is_success == "0" and $failed_step != "" then
                [ row("FAILED AT"; ($failed_step|esc)) ]
              else [] end )
            + ( if $subject != "" then [ row("COMMIT"; ($subject|esc)) ] else [] end )
            + ( if $pr_label != "" then
                  [ row("PR"; (if $pr_url != "" then "<" + $pr_url + "|" + $pr_label + ">" else $pr_label end)) ]
                else [] end )
            + [ row("AUTHOR"; ($author|esc)) ]
            + [ row("HASH"; (if $commit_url != "" then "<" + $commit_url + "|`" + $short_sha + "`>" else "`" + $short_sha + "`" end)) ]
            + ( if $duration != "" then [ row("DURATION"; $duration) ] else [] end )
            + [ row("DATE"; ($built + " UTC")) ]
            + ( if $is_success == "1" and $url_display != "" then
                  [ row("URL"; "<" + $url_full + "|" + $url_display + ">") ]
                else [] end )
            | join("\n")
          ')"

          # Header emoji conveys status; no separate context/subtitle block.
          payload="$(jq -n \
            --arg icon "$icon" --arg label "$LABEL" --arg version "$version" \
            --arg runurl "$RUN_URL" \
            --arg rows_text "$rows_text" '
            { blocks:
              [ { type:"header", text:{ type:"plain_text", text:($icon + " " + $label + " " + $version), emoji:true } },
                { type:"section", text:{ type:"mrkdwn", text: $rows_text } },
                { type:"actions", elements:[
                    { type:"button",
                      text:{ type:"plain_text", text:"View run" },
                      url: $runurl } ] } ]
            }')"
        fi

        # -f makes curl fail on HTTP >=400 so Slack payload rejections surface in
        # the log instead of being silently reported as a successful send.
        if curl -fsS -X POST -H 'Content-Type: application/json' --data "$payload" "$WEBHOOK" >/dev/null; then
          echo "Slack notification sent."
        else
          echo "Slack notification failed (ignored, best-effort)."
        fi
        exit 0
